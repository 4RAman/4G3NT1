<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Button</title>
<style>
  :root {
    /* Deep, flat canvas + a slightly raised chrome tone for header/nav/bars -
       content panes sit directly on --bg so nothing reads as a box nested in
       a box. --radius is one variable so "not rounded" is one edit, not a
       hunt: 0 everywhere except the two things that depict a physical round
       LED (the virtual device disc, a palette swatch) and the small "this is
       live" status dot, which borrows the same round-light language. */
    --bg: #0b0d10; --panel: #12151a; --line: #1e242c;
    --text: #d8dee6; --dim: #8a94a3;
    --blue: #4f8ef7; --amber: #e0a93e; --green: #43b97f; --red: #e05c5c;
    --radius: 0px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.5 system-ui, sans-serif; font-variant-numeric: tabular-nums;
         overflow: hidden; } /* the app shell owns scrolling; the page itself never does */

  button:focus, input:focus, select:focus, textarea:focus, a:focus { outline: none; }
  :focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }

  h1 { font-size: 15px; margin: 0; font-weight: 600; }
  h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .08em;
       color: var(--dim); margin: 0 0 10px; font-weight: 600; }

  button { background: #171b21; color: var(--text); border: 1px solid var(--line);
           border-radius: var(--radius); padding: 7px 14px; font: inherit; cursor: pointer; }
  button:hover { background: #1c2129; border-color: #333c48; }
  /* The one accent colour is spent on focus rings and the primary action's
     border - never as a filled background competing with badge/state hues. */
  button.primary { border-color: var(--blue); color: #cfe0ff; }
  button.primary:hover { background: #16202f; }
  input[type=time], input[type=text], input[type=number], .inp {
    background: #0d1014; color: var(--text); font: inherit;
    border: 1px solid var(--line); border-radius: var(--radius); padding: 6px 10px;
  }
  input[type=checkbox] { width: auto; accent-color: var(--blue); }

  /* --- app shell: one fixed-height frame, everything else scrolls inside it --- */
  .app { height: 100dvh; display: flex; flex-direction: column; }

  .app-header { flex-shrink: 0; background: var(--panel); border-bottom: 1px solid var(--line);
                padding: 10px 20px; }
  .header-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  #meta { color: var(--dim); font-size: 12px; }
  #last { color: var(--dim); font-size: 12px; margin: 4px 0 0; min-height: 1.2em;
          overflow-wrap: anywhere; }
  /* A test clock is a mode, not an event: a small always-visible chip beside
     the status line, so turning it on never reflows the page under you. */
  #clockbar { background: #3a2c10; color: #ffd98a; border: 1px solid #5c4413;
              border-radius: var(--radius); padding: 3px 10px; font-size: 12px; }
  /* One switch for every [data-help] node in the page - see help.js. */
  .help-toggle, .pane-toggle { margin-left: auto; padding: 3px 10px; font-size: 12px; color: var(--dim); }
  .help-toggle[aria-pressed="true"], .pane-toggle[aria-expanded="false"] {
    color: var(--text); border-color: var(--blue); }
  /* The view switches, grouped: they change how much of the page you are
     looking at, as opposed to anything about the button. One cluster so they
     read as a set - Tinker mode lands here too. (The offline editor has only
     Tips and no cluster, which is why .help-toggle keeps its own auto margin
     above and gives it up in here.) */
  .header-tools { margin-left: auto; display: flex; gap: 6px; align-items: center; }
  .header-tools > button { margin-left: 0; }

  .badge { padding: 2px 10px; border-radius: var(--radius); font-size: 12px; font-weight: 600;
           background: var(--line); }
  .badge.IDLE { background: #1d3a6e; color: #9ec2ff; }
  .badge.THINKING { background: #5c4413; color: #ffd98a; }
  .badge.SUCCESS { background: #14452e; color: #8fe6bb; }
  .badge.ERROR, .badge.OFFLINE { background: #58201f; color: #ffb3b0; }
  .badge.ALARMING { background: #6e1d1d; color: #ffdede; animation: alarmPulse .7s steps(1) infinite; }
  @keyframes alarmPulse { 0%, 100% { background: #6e1d1d; color: #ffdede; }
                          50% { background: #e05c5c; color: #2a0d0d; } }
  .badge.TIMING { background: #0c4a4a; color: #8ff0ee; }
  .badge.COUNTING { background: #4a1d52; color: #f0b6ff; }

  /* --- the two-pane body: device on the left, tabbed work surface on the right --- */
  .app-body { flex: 1; min-height: 0; display: grid; grid-template-columns: 280px 1fr; }
  @media (max-width: 900px) {
    .app-body { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
  }
  /* Folded away (see sidepane.js). The track is removed rather than zeroed so
     the pane's border doesn't survive as a stray line, and the row axis is
     reset too because under 900px the pane is a row, not a column. */
  .app-body.side-collapsed { grid-template-columns: 1fr; }
  .app-body.side-collapsed > .side-pane { display: none; }
  @media (max-width: 900px) {
    .app-body.side-collapsed { grid-template-rows: 1fr; }
  }

  .side-pane { background: var(--panel); border-right: 1px solid var(--line);
               padding: 16px 18px; overflow-y: auto; min-height: 0; }
  @media (max-width: 900px) {
    .side-pane { border-right: none; border-bottom: 1px solid var(--line); max-height: 38vh; }
  }
  .side-block + .side-block { border-top: 1px solid var(--line); margin-top: 16px; padding-top: 16px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .hint { color: var(--dim); font-size: 12px; margin: 8px 0 0; }
  .virtual-row { display: flex; align-items: center; gap: 18px; }
  /* static/ledPreview.js paints this from the configured palette, frame by
     frame, with the same maths the firmware uses - one definition of "what
     SUCCESS looks like", not two. Stays round: it depicts the physical LED. */
  .led { width: 34px; height: 34px; border-radius: 50%; flex-shrink: 0; background: #20262e; }
  #vstate { font-weight: 600; }
  #vsound { color: var(--dim); font-size: 13px; }

  .main-pane { min-height: 0; display: flex; flex-direction: column; }
  /* The scene bar sits above the tabs and reads as chrome, not content:
     same raised tone as the header, so switching what the button *is* never
     looks like editing one of the things it does. */
  .scene-bar { flex-shrink: 0; display: flex; align-items: center; gap: 8px;
               flex-wrap: wrap; padding: 8px 20px; background: var(--panel);
               border-bottom: 1px solid var(--line); }
  .scene-label { font-size: 11px; text-transform: uppercase; letter-spacing: .08em;
                 color: var(--dim); font-weight: 600; }
  .scene-pick { min-width: 220px; }
  .scene-btn { padding: 5px 10px; font-size: 13px; }
  .scene-btn:disabled { color: var(--dim); cursor: default; background: #14171c; }
  .scene-msg { font-size: 12px; color: var(--dim); margin: 0; }
  /* Full-width so a warning wraps under the controls instead of squeezing
     the picker - these two lines are the ones people have to actually read. */
  .scene-bar > p.scene-msg { flex-basis: 100%; }
  .scene-msg.ok { color: var(--green); }
  .scene-msg.warn { color: var(--amber); }
  .scene-msg.err { color: var(--red); }

  .tab-bar { flex-shrink: 0; display: flex; gap: 2px; padding: 0 20px;
             border-bottom: 1px solid var(--line); background: var(--bg); }
  .tab-btn { background: none; border: none; color: var(--dim); padding: 12px 14px;
             font: inherit; font-size: 13px; cursor: pointer;
             border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .tab-btn:hover { color: var(--text); }
  .tab-btn[aria-selected="true"] { color: var(--text); border-bottom-color: var(--blue); }

  .tab-panels { flex: 1; min-height: 0; position: relative; }
  .tab-panel { position: absolute; inset: 0; overflow-y: auto; padding: 18px 20px; }
  .tab-panel[hidden] { display: none; }
  /* Scrollbar hidden, replaced by a fade that only shows where there is more
     to see in that direction (background-attachment: local clips the fade
     to the scrolled-past content, so it disappears at the true start/end). */
  .scroll-fade {
    scrollbar-width: none; background-color: var(--bg);
    background-image:
      linear-gradient(var(--bg) 30%, rgba(0,0,0,0)),
      linear-gradient(rgba(0,0,0,0), var(--bg) 70%),
      linear-gradient(to bottom, rgba(0,0,0,.5), rgba(0,0,0,0)),
      linear-gradient(to top, rgba(0,0,0,.5), rgba(0,0,0,0));
    background-repeat: no-repeat;
    background-size: 100% 28px, 100% 28px, 100% 12px, 100% 12px;
    background-position: top, bottom, top, bottom;
    background-attachment: local, local, scroll, scroll;
  }
  .side-pane.scroll-fade { background-color: var(--panel); }
  .scroll-fade::-webkit-scrollbar { width: 0; height: 0; }

  .menu-bar { flex-shrink: 0; display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
              padding: 12px 20px; background: var(--panel); border-top: 1px solid var(--line); }
  .menu-status { color: var(--dim); font-size: 12px; }
  .menu-result { flex-basis: 100%; font-size: 13px; white-space: pre-wrap; margin: 0;
                 overflow-wrap: anywhere; }
  .menu-result.ok { color: var(--green); }
  .menu-result.warn { color: var(--amber); }
  .menu-result.err { color: var(--red); }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--line); }
  th { color: var(--dim); font-weight: 500; }
  .kind-log { color: var(--green); }
  .kind-timer_start { color: var(--amber); }
  .kind-mode_enter { color: var(--blue); }
  .kind-mode_exit { color: var(--dim); }
  .empty { color: var(--dim); font-size: 13px; }

  /* --- config menu ------------------------------------------------- */
  .menu-h { font-size: 15px; margin: 0 0 2px; }
  .menu-hint { color: var(--dim); font-size: 12px; margin: 0 0 10px; }
  .primer { border-left: 2px solid var(--blue); padding: 2px 0 2px 12px; margin: 0 0 18px; }
  .primer-lead { margin: 0 0 6px; font-size: 13px; font-weight: 600; }
  .primer-list { margin: 0; padding-left: 18px; color: var(--dim); font-size: 12px; line-height: 1.55; }
  .primer-line { margin-bottom: 3px; }

  /* --- modes: master/detail, not a stack of accordions --- */
  .mode-layout { display: flex; gap: 20px; align-items: flex-start; }
  /* The tab panel is the scroll container (nav + detail scroll together);
     pinning the nav keeps the mode list and "+ Add mode" reachable while a
     long detail form scrolls underneath, the way a real master/detail split
     behaves. */
  .mode-nav-col { flex-shrink: 0; width: 250px; display: flex; flex-direction: column; gap: 12px;
                  position: sticky; top: 0; background: var(--bg); }
  .mode-nav-group { margin-bottom: 16px; }
  .mode-nav-group-title { font-size: 11px; text-transform: uppercase; letter-spacing: .06em;
                           color: var(--text); margin: 0 0 3px; }
  .mode-nav-group-hint { font-size: 11px; color: var(--dim); line-height: 1.5; margin: 0 0 8px; }
  .mode-nav-empty { font-size: 12px; padding: 2px 0; }
  .mode-nav-item { display: flex; align-items: center; gap: 8px; width: 100%;
                   text-align: left; background: none; border: none;
                   border-left: 2px solid transparent; border-radius: 0;
                   padding: 7px 8px; margin: 0 0 2px -2px; cursor: pointer; }
  .mode-nav-item:hover { background: #1a1f26; }
  .mode-nav-item.selected { background: #161b22; border-left-color: var(--blue); }
  .mode-nav-name { font-weight: 600; font-size: 13px; overflow: hidden; text-overflow: ellipsis;
                   white-space: nowrap; max-width: 100px; }
  .mode-nav-summary { color: var(--dim); font-size: 11px; overflow: hidden; text-overflow: ellipsis;
                      white-space: nowrap; flex: 1; min-width: 0; }
  /* A live "this is the one answering presses right now" light - round, like
     the physical LED it is standing in for. */
  .mode-active-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0;
                      background: var(--green); box-shadow: 0 0 6px var(--green); }

  .mode-detail { flex: 1; min-width: 0; }
  .mode-detail-empty { color: var(--dim); font-size: 13px; padding: 8px 0; }
  .mode-active { font-size: 11px; font-weight: 600; color: var(--green); white-space: nowrap; }
  .howto { border-left: 2px solid var(--line); margin-left: 4px; padding: 2px 0 2px 12px; }
  .howto[hidden] { display: none; }
  .howto-line { margin: 0 0 3px; color: var(--dim); font-size: 12px; }
  .howto-line:last-child { margin-bottom: 0; }
  .howto-warn { color: var(--amber); }
  .mode-body { display: flex; flex-direction: column; gap: 12px; }
  .mode-edit-head { display: flex; gap: 8px; align-items: center; }
  .mode-name { flex: 1; font-weight: 600; }
  .pick-row { display: flex; flex-direction: column; gap: 8px; }
  .pick-head { display: flex; gap: 10px; align-items: center; }
  .pick-head .fld-label { min-width: 80px; }
  .pick-head .inp { max-width: 220px; }
  .tpl-body, .act-body { border-left: 2px solid var(--line); margin-left: 4px;
                         padding: 4px 0 4px 12px; display: flex; flex-direction: column; gap: 8px; }
  .tpl-body:empty, .act-body:empty { display: none; }
  .tpl-fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
  .mini { padding: 4px 9px; line-height: 1; }
  .mini.danger { color: #ffb3b0; border-color: #58201f; }
  .scope-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .scope-lbl { color: var(--dim); font-size: 12px; min-width: 200px; }
  .sep { color: var(--dim); }
  .days-row { gap: 6px; }
  .day-pill { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; color: var(--dim); }
  .gestures { display: flex; flex-direction: column; gap: 10px; margin-top: 2px; }
  .gesture-row { border-top: 1px solid var(--line); padding-top: 10px; }
  .gesture-head { display: flex; gap: 10px; align-items: center; }
  .gesture-name { min-width: 96px; font-size: 13px; font-weight: 600; }
  .gesture-fields { display: flex; flex-direction: column; gap: 8px; margin: 8px 0 0 96px; }
  .add-mode { margin-top: 2px; }
  .add-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .builtin-wrap { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .builtin-pick { max-width: 100%; }
  .builtin-blurb { color: var(--dim); font-size: 12px; }

  /* --- lights: one flat divided list, no nested boxes --- */
  .palette-row { border-bottom: 1px solid var(--line); padding: 12px 0; }
  .palette-row:first-child { padding-top: 0; }
  .palette-row:last-child { border-bottom: none; padding-bottom: 0; }
  .palette-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
  /* Stays round: it depicts the physical LED. */
  .palette-swatch { width: 20px; height: 20px; border-radius: 50%; flex-shrink: 0; background: #20262e; }
  .palette-name { font-weight: 600; }
  .palette-meaning { color: var(--dim); font-size: 12px; }
  .palette-summary { color: var(--dim); font-size: 12px; margin-left: auto; }
  .color-row { display: flex; align-items: center; gap: 8px; }
  .inp-color { width: 46px; height: 30px; padding: 2px; cursor: pointer; }
  .fld-hex { color: var(--dim); font-size: 12px; font-family: ui-monospace, monospace; }

  .settings-wrap { display: flex; flex-direction: column; gap: 18px; }
  .settings-title { font-size: 11px; text-transform: uppercase; letter-spacing: .06em;
                    color: var(--dim); margin: 0 0 8px; }
  .settings-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }
  .fld { display: flex; flex-direction: column; gap: 3px; font-size: 13px; }
  .fld-check { flex-direction: row; align-items: center; gap: 8px; }
  .fld-label { color: var(--dim); font-size: 12px; }
  .fld-hint { color: var(--dim); font-size: 11px; }
  .fld-err { color: var(--red); font-size: 11px; min-height: 0; }
  .inp { width: 100%; }
  .inp.mono { font: 13px/1.45 ui-monospace, monospace; }
  textarea.inp { resize: vertical; }
</style>
</head>
<body>

<div class="app">
  <header class="app-header">
    <div class="header-row">
      <h1>AI Button</h1>
      <span id="state" class="badge">…</span>
      <span id="meta"></span>
      <span id="clockbar" hidden></span>
      <div class="header-tools">
        <button type="button" id="help-toggle" class="help-toggle" aria-pressed="false">ⓘ Tips</button>
        <button type="button" id="pane-toggle" class="pane-toggle"
                aria-expanded="true" aria-controls="side-pane">◧ Panel</button>
      </div>
    </div>
    <p id="last"></p>
  </header>

  <div class="app-body">
    <aside class="side-pane scroll-fade" id="side-pane">
      <div id="virtual" class="side-block" hidden>
        <h2>Virtual device</h2>
        <div class="virtual-row">
          <div id="vled" class="led IDLE"></div>
          <div>
            <div id="vstate">IDLE</div>
            <div id="vsound">no sound yet</div>
          </div>
        </div>
      </div>

      <div class="side-block">
        <h2>Press</h2>
        <div class="row">
          <button data-trigger="short_press">Short press</button>
          <button data-trigger="long_press">Long press</button>
          <button data-trigger="double_tap">Double tap</button>
        </div>
      </div>

      <div class="side-block">
        <h2>Clock</h2>
        <div class="row">
          <input type="time" id="clock-input" step="60">
          <button id="clock-set">Set</button>
          <button id="clock-clear">Real time</button>
        </div>
        <p class="hint" data-help>Shifts what time the device thinks it is - set
        06:30 to try a 5-7am window mode, or 06:59 to watch a 07:00 alarm fire.
        Keeps ticking, never persists, doesn't change event timestamps.</p>
      </div>
    </aside>

    <main class="main-pane">
      <!-- Above the tabs on purpose: a scene spans modes, lights and device
           settings, so it is not a property of any one tab. -->
      <div class="scene-bar" id="scene-bar"></div>
      <nav class="tab-bar" role="tablist">
        <button type="button" class="tab-btn" data-tab="modes" role="tab" aria-selected="true">Modes</button>
        <button type="button" class="tab-btn" data-tab="lights" role="tab" aria-selected="false">Lights</button>
        <button type="button" class="tab-btn" data-tab="events" role="tab" aria-selected="false">Events</button>
        <button type="button" class="tab-btn" data-tab="device" role="tab" aria-selected="false">Device</button>
      </nav>
      <div class="tab-panels">
        <section class="tab-panel scroll-fade" data-panel="modes" id="panel-modes">Loading…</section>
        <section class="tab-panel scroll-fade" data-panel="lights" id="panel-lights" hidden>Loading…</section>
        <section class="tab-panel scroll-fade" data-panel="events" id="panel-events" hidden>
          <div id="events"></div>
        </section>
        <section class="tab-panel scroll-fade" data-panel="device" id="panel-device" hidden>Loading…</section>
      </div>
      <div class="menu-bar" id="menu-bar"></div>
    </main>
  </div>
</div>

<script>
  // Tabs are page-level (they gate content menu.js renders into each panel),
  // so this stays a plain inline script rather than living inside a module.
  (function () {
    const tabs = document.querySelectorAll('.tab-btn');
    const panels = document.querySelectorAll('.tab-panel');
    function activate(name) {
      tabs.forEach((t) => t.setAttribute('aria-selected', String(t.dataset.tab === name)));
      panels.forEach((p) => { p.hidden = p.dataset.panel !== name; });
    }
    tabs.forEach((t) => t.addEventListener('click', () => activate(t.dataset.tab)));
  })();
</script>

<!-- The global Tips toggle - loads first so [data-help] content starts hidden
     before menu.js has anything to render. -->
<script type="module" src="/static/help.js"></script>

<!-- The side pane's fold. Served page only: the offline editor has no pane. -->
<script type="module" src="/static/sidepane.js"></script>

<!-- Config menu: structured editor, built from ES modules (no build step). -->
<script type="module" src="/static/menu.js"></script>

<!-- Dashboard: status, virtual device, dev controls, event log. -->
<script type="module">
import { paint } from '/static/ledPreview.js';

const $ = s => document.querySelector(s);
let soundSeq = null;

async function api(path, opts) {
  const res = await fetch(path, opts);
  const data = await res.json().catch(() => null);
  if (!res.ok) throw new Error((data && (data.detail || data.error)) || `HTTP ${res.status}`);
  return data;
}

function fmtUptime(s) {
  const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60);
  return d ? `${d}d ${h}h` : h ? `${h}h ${m}m` : `${m}m`;
}

function fmtDuration(s) {
  s = Math.round(s);
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), sec = s % 60;
  return h ? `${h}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`
           : `${m}:${String(sec).padStart(2,'0')}`;
}

const GESTURES = { short_press: 'short press', long_press: 'long press', double_tap: 'double tap' };

async function refreshStatus() {
  try {
    const d = await api('/api/status');
    const badge = $('#state');
    badge.textContent = d.state;
    badge.className = 'badge ' + d.state;
    $('#meta').textContent =
      `${d.device_name} · v${d.version} · up ${fmtUptime(d.uptime_s)} · ${d.mode_count} mode${d.mode_count === 1 ? '' : 's'}` +
      // With a real button, say whether it is actually on the air: the app
      // runs either way, so "nothing happens when I press it" needs an answer
      // in the UI rather than in the log.
      (d.mock ? ' · MOCK' : (d.device_connected ? ' · 🔵 BUTTON CONNECTED' : ' · ⚪ BUTTON OFFLINE'));
    // last_trigger is null for scheduler-fired alarms - still surface the
    // outcome (mode + message) so a fired/dismissed alarm shows in the summary.
    $('#last').textContent = (d.last_trigger || d.last_mode || d.last_message)
      ? 'Last: ' +
        (d.last_trigger
          ? (GESTURES[d.last_trigger] || d.last_trigger) + (d.last_mode ? ` → ${d.last_mode}` : '')
          : (d.last_mode || '')) +
        (d.last_message ? ` - ${d.last_ok ? '' : '⚠️ '}${d.last_message}` : '')
      : '';

    // test clock chip
    const bar = $('#clockbar');
    bar.hidden = !d.clock_override;
    if (d.clock_override) {
      bar.textContent = `⏱ TEST CLOCK - device thinks it is ${d.now.replace('T', ' ')}`;
    }

    // virtual device panel (mock mode only)
    $('#virtual').hidden = !d.mock;
    if (d.mock) {
      // Painted from the configured palette, so the browser shows the same
      // effect the real LED would - including any colour you have edited.
      const effect = (d.led_palette || {})[d.led_state];
      if (effect) paint($('#vled'), effect);
      $('#vstate').textContent = d.led_state;
      if (soundSeq !== null && d.sound_seq !== soundSeq && d.last_sound) {
        new Audio('/api/dev/sound/' + d.last_sound).play().catch(() => {});
      }
      if (d.last_sound) $('#vsound').textContent = `last sound: ${d.last_sound}`;
    }
    soundSeq = d.sound_seq;
  } catch {
    const badge = $('#state');
    badge.textContent = 'OFFLINE';
    badge.className = 'badge OFFLINE';
  }
}

async function refreshEvents() {
  try {
    const rows = await api('/api/events?limit=30');
    $('#events').innerHTML = rows.length
      ? `<table><tr><th>When</th><th>Kind</th><th>Name</th><th>Mode</th><th>Duration</th></tr>` +
        rows.map(r => `<tr>
          <td>${new Date(r.ts).toLocaleString([], {month:'short', day:'numeric', hour:'2-digit', minute:'2-digit'})}</td>
          <td class="kind-${r.kind}">${r.kind.replace('_', ' ')}</td>
          <td>${r.name}</td>
          <td>${r.mode ?? ''}</td>
          <td>${r.duration_s != null ? fmtDuration(r.duration_s) : ''}</td>
        </tr>`).join('') + '</table>'
      : '<p class="empty">No events yet.'
        + '<span data-help> Bind a press to Log/Timer in Modes, then press the button.</span></p>';
  } catch { /* server briefly away; keep last view */ }
}

$('#clock-set').addEventListener('click', async () => {
  const value = $('#clock-input').value;
  if (!value) return;
  try { await api('/api/dev/clock', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ time: value }),
  }); refreshStatus(); }
  catch (e) { console.warn(e); }
});

$('#clock-clear').addEventListener('click', async () => {
  try { await api('/api/dev/clock', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ clear: true }),
  }); refreshStatus(); }
  catch (e) { console.warn(e); }
});

document.querySelectorAll('[data-trigger]').forEach(btn =>
  btn.addEventListener('click', async () => {
    try { await api('/api/trigger/' + btn.dataset.trigger, { method: 'POST' }); }
    catch (e) { console.warn(e); }
    setTimeout(refreshStatus, 250);
    setTimeout(refreshEvents, 2500);
  }));

refreshStatus(); refreshEvents();
setInterval(refreshStatus, 1000);
setInterval(refreshEvents, 5000);
</script>
</body>
</html>
