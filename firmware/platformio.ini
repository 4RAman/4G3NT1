; PlatformIO project for the 4G3NT1 button firmware (ESP32-C3).
;
; STATUS: scaffold. The portable cores (lib/gesture, lib/synth) are implemented
; and host-tested (see Makefile / firmware/README.md). The ESP32 glue in src/
; (I2S audio, LEDC RGB, GPIO button) is written against the Arduino-ESP32 /
; ESP-IDF APIs but has NOT yet been compiled or flashed in this environment.
;
;   pio run -e esp32c3            # build firmware (needs the espressif32 platform)
;   pio run -e esp32c3 -t upload  # flash
;   pio test -e native           # host tests via Unity (or: make test)

[platformio]
default_envs = esp32c3

[env:esp32c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
build_flags =
    -std=gnu++17
    -Ilib/gesture
    -Ilib/synth
; ArduinoJson is used by the (future) config loader that mirrors config.py.
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.0

; Host-native env so `pio test -e native` can run the same pure-core tests the
; Makefile builds. The tests under test/ use plain asserts; Unity is available
; if you prefer to wrap them.
[env:native]
platform = native
build_flags =
    -std=c++17
    -Ilib/gesture
    -Ilib/synth
